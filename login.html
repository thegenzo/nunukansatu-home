<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk — Nunukan Satu</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">

    <style>
        :root {
            --primary-red: #D32F2F;
            --bg-gray: #E0E0E0;
            --input-bg: #EFEFEF;
            --text-secondary: #939393;
            --white: #F5F5F5;
        }

        html, body {
            height: 100%;
            width: 100%;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background-color: var(--bg-gray);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 0;
        }

        .login-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 32px;
            width: 100%;
            max-width: 400px;
            padding: 20px;
        }

        .logo-section {
            width: 302px;
            height: 153px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo-section img {
            max-width: 100%;
            height: auto;
            object-fit: contain;
        }

        .form-section {
            display: flex;
            flex-direction: column;
            gap: 16px;
            width: 100%;
            max-width: 345px;
        }

        .form-input {
            height: 54px;
            padding: 0 25px;
            border: none;
            border-radius: 10px;
            background-color: var(--input-bg);
            font-family: 'Roboto', sans-serif;
            font-size: 16px;
            font-weight: 400;
            color: var(--text-secondary);
        }

        .form-input::placeholder {
            color: var(--text-secondary);
        }

        .form-input:focus {
            outline: none;
            background-color: #FFF;
            box-shadow: 0 0 0 2px rgba(211, 47, 47, 0.1);
        }

        .btn-login-primary {
            height: 54px;
            padding: 15px 25px;
            border-radius: 10px;
            background-color: var(--primary-red);
            color: var(--white);
            border: 2px solid var(--primary-red);
            font-family: 'Roboto', sans-serif;
            font-size: 16px;
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
        }

        .btn-login-primary:hover {
            background-color: #b71c1c;
            border-color: #b71c1c;
            color: var(--white);
        }

        .btn-login-primary i {
            font-size: 20px;
        }

        @media (max-width: 576px) {
            .login-container {
                gap: 24px;
                max-width: 100%;
                padding: 20px 15px;
            }

            .form-section {
                max-width: 100%;
            }

            .btn-login-primary {
                width: 100%;
            }
        }
    </style>
</head>

<body>
    <div class="login-container">
        <!-- Logo Section -->
        <div class="logo-section">
            <img src="./assets/img/nunukan-1.png" alt="Nunukan Satu Logo">
        </div>

        <!-- Form Section -->
        <div class="form-section">
            <!-- Email/NIK Input -->
            <input 
                type="text" 
                class="form-input" 
                placeholder="Input Text Here"
                aria-label="Email atau NIK"
            >

            <!-- Password Input -->
            <input 
                type="password" 
                class="form-input" 
                placeholder="Input Text Here"
                aria-label="Kata Sandi"
            >

            <!-- Login Button -->
            <a href="index-2.html" class="btn-login-primary">
                <i class="bi bi-person-check"></i>
                <span>Masuk Dengan MyAsn</span>
            </a>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
