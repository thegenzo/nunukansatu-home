<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memuat Layanan... - Nunukan Satu</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Roboto:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="../public-services/public-services.css">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>

<body>
    <header class="navbar-header">
        <div class="navbar-decor-left"></div>
        <div class="navbar-decor-right"></div>
        <div class="navbar-content container-fluid d-flex justify-content-between align-items-center">
            <div class="navbar-logo-section">
                <img src="../assets/img/nunukan-icon.png" alt="Nunukan Satu Logo" class="navbar-logo">
                <div>
                    <h1 class="navbar-title" id="layanan-title">Memuat...</h1>
                    <div class="navbar-bar"></div>
                </div>
            </div>
            <div class="navbar-actions">
                <button id="searchBtn" class="btn-navbar-search">
                    <i class="bi bi-search"></i>
                    <span>Search</span>
                </button>
                <a href="../index-2.html" class="btn-navbar-news">
                    <i class="bi bi-arrow-return-left"></i>
                    <span>Kembali</span>
                </a>
            </div>
        </div>
    </header>

    <!-- Search Results Modal -->
    <div id="searchModal" class="modal-overlay search-modal-overlay">
        <div class="modal-content search-modal-content">
            <!-- Search Header with Input -->
            <div class="search-header">
                <input type="text" id="searchInput" class="search-input" placeholder="Cari layanan, berita, atau informasi...">
                <button class="close-modal btn btn-sm btn-danger px-3" id="closeSearchModal">
                    <i class="bi bi-x"></i>
                    <span>Keluar</span>
                </button>
            </div>

            <!-- Tab Navigation -->
            <div class="search-tabs">
                <button class="search-tab active" data-tab="all">
                    <span class="tab-icon">
                        <i class="bi bi-list"></i>
                    </span>
                    <span class="tab-label">Semua</span>
                </button>
                <button class="search-tab" data-tab="publik">
                    <span class="tab-icon">
                        <i class="bi bi-info-circle"></i>
                    </span>
                    <span class="tab-label">Informasi Publik</span>
                    <span class="tab-count">10</span>
                </button>
                <button class="search-tab" data-tab="adm">
                    <span class="tab-icon">
                        <i class="bi bi-building"></i>
                    </span>
                    <span class="tab-label">Informasi ADM Pemerintah</span>
                    <span class="tab-count">11</span>
                </button>
                <button class="search-tab" data-tab="berita">
                    <span class="tab-icon">
                        <i class="bi bi-newspaper"></i>
                    </span>
                    <span class="tab-label">Berita</span>
                    <span class="tab-count">6</span>
                </button>
            </div>

            <!-- Search Results Content -->
            <div class="search-results-body">
                <!-- Tab: Semua -->
                <div class="search-tab-content active" id="tab-all">
                    <!-- Will be populated by JavaScript -->
                </div>

                <!-- Tab: Informasi Publik -->
                <div class="search-tab-content" id="tab-publik">
                    <!-- Will be populated by JavaScript -->
                </div>

                <!-- Tab: Informasi ADM Pemerintah -->
                <div class="search-tab-content" id="tab-adm">
                    <!-- Will be populated by JavaScript -->
                </div>

                <!-- Tab: Berita -->
                <div class="search-tab-content" id="tab-berita">
                    <!-- Will be populated by JavaScript -->
                </div>
            </div>
        </div>
    </div>

    <!-- Biarkan src kosong, akan diisi oleh JavaScript -->
    <iframe id="layanan-iframe" style="width: 100%; height: calc(100vh - 100px)" src="" frameborder="0"></iframe>

    <!-- Bagian JavaScript untuk mengambil parameter URL -->
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            // 1. Ambil Query Parameters dari URL (misal: ?name=TNDD&url=...)
            const urlParams = new URLSearchParams(window.location.search);

            // 2. Ekstrak nilai dari 'name' dan 'url'
            const serviceName = urlParams.get('name');
            const serviceUrl = urlParams.get('url');

            // 3. Pastikan parameter ada sebelum memanipulasi DOM
            if (serviceName && serviceUrl && serviceUrl !== '#') {
                // Ubah Title Halaman
                document.title = `${serviceName} - Nunukan Satu`;

                // Ubah Judul Layanan di Header (Navbar)
                document.getElementById('layanan-title').textContent = serviceName;

                // Ubah dan Muat URL ke dalam Iframe
                document.getElementById('layanan-iframe').src = serviceUrl;
            } else {
                // Tampilkan pesan error jika URL diakses secara langsung tanpa parameter atau url kosong
                document.getElementById('layanan-title').textContent = serviceName || "Layanan Tidak Ditemukan";
                document.getElementById('layanan-iframe').outerHTML = `
                    <div class="container mt-5 text-center">
                        <h2 style="color: white">Maaf, URL layanan belum tersedia atau tidak valid.</h2>
                        <a href="../index-2.html" class="btn btn-primary mt-3">Kembali ke Beranda</a>
                    </div>
                `;
            }
        });
    </script>
    
    <script src="../search.js"></script>
</body>

</html>
