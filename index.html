<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nunukan Satu - Kantor Daring</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>

<body>

    <!-- Main Background -->
    <div class="main-background"></div>

    <!-- Header / Navbar -->
    <nav class="navbar fixed-top mt-4">
        <div class="container d-flex justify-content-center">
            <div
                class="floating-nav bg-white rounded-pill px-4 py-2 shadow-sm d-flex align-items-center justify-content-between">
                <!-- Logo Area -->
                <div class="d-flex align-items-center gap-2">
                    <img src="./assets/img/Nunukansatu Logo1 2.png" alt="Nunukan Satu Logo" height="40">
                </div>

                <!-- Search Button -->
                <div class="ms-5">
                    <button class="btn btn-primary-red rounded-3 px-4 py-2 d-flex align-items-center gap-2">
                        <i class="bi bi-search"></i>
                        <span>Search</span>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content / Central Button -->
    <main class="container-fluid d-flex justify-content-center align-items-center"
        style="height: 100vh; pointer-events: none;">
        <!-- Central Diamond Button -->
        <div class="central-button-container" style="pointer-events: auto;">
            <a href="#" class="btn-main-diamond d-block text-decoration-none">
                <img src="./assets/img/Main Button Flat 1.png" alt="Nunukan Satu" class="img-fluid main-logo-img">
            </a>
        </div>
    </main>

    <!-- Footer -->
    <footer class="fixed-bottom bg-white py-3 border-top">
        <div class="container-fluid px-5 d-flex justify-content-between align-items-center">
            <!-- Left: Logo/Icon (Hidden on screenshot but keeping structure clean) -->
            <div class="d-flex align-items-center gap-2 footer-logo-section">
                <!-- Matching the screenshot which shows logo on bottom left -->
                <div class="logo-icon-sm bg-primary-red rounded-1 d-flex align-items-center justify-content-center"
                    style="width: 30px; height: 30px;">
                    <div class="diamond-sm bg-white" style="width: 12px; height: 12px; transform: rotate(45deg);"></div>
                </div>
                <div class="logo-text lh-1">
                    <small class="d-block text-muted" style="font-size: 0.5rem;">KANTOR DARING</small>
                    <span class="fw-bold fs-6">NUNUKAN <span class="fw-normal">SATU</span></span>
                </div>
            </div>

            <!-- Center: Copyright -->
            <div class="text-center">
                <small class="fw-bold text-uppercase" style="font-size: 0.7rem; letter-spacing: 1px;">&copy; 2026
                    PEMERINTAH KABUPATEN NUNUKAN. ALL RIGHTS RESERVED.</small>
            </div>

            <!-- Right: Pengaduan Button -->
            <div>
                <button class="btn btn-outline-danger px-4 py-1 d-flex align-items-center gap-2" style="border-radius: 10px;">
                    <i class="bi bi-chevron-up"></i>
                    <span>Pengaduan</span>
                </button>
            </div>
        </div>
    </footer>

    <!-- Floating Live Chat Button -->
    <div class="position-fixed bottom-0 end-0 m-4 mb-5 pb-4" style="z-index: 1050;">
        <button class="btn btn-primary-red rounded-circle shadow-lg d-flex align-items-center justify-content-center"
            style="width: 60px; height: 60px;">
            <i class="bi bi-headset fs-3"></i>
        </button>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
