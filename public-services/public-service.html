<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memuat Layanan... - Nunukan Satu</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Roboto:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="./public-services.css">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>

<body>
    <header class="navbar-header">
        <div class="navbar-decor-left"></div>
        <div class="navbar-decor-right"></div>
        <div class="navbar-content container-fluid d-flex justify-content-between align-items-center">
            <div class="navbar-logo-section">
                <img src="../assets/img/nunukan-icon.png" alt="Nunukan Satu Logo" class="navbar-logo">
                <div>
                    <h1 class="navbar-title" id="layanan-title">Memuat...</h1>
                    <div class="navbar-bar"></div>
                </div>
            </div>
            <div class="navbar-actions">
                <button class="btn-navbar-search">
                    <i class="bi bi-search"></i>
                    <span>Search</span>
                </button>
                <a href="../index.html" class="btn-navbar-news">
                    <i class="bi bi-arrow-return-left"></i>
                    <span>Kembali</span>
                </a>
            </div>
        </div>
    </header>

    <!-- Biarkan src kosong, akan diisi oleh JavaScript -->
    <iframe id="layanan-iframe" style="width: 100%; height: calc(100vh - 100px)" src="" frameborder="0"></iframe>

    <!-- Bagian JavaScript untuk mengambil parameter URL -->
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            // 1. Ambil Query Parameters dari URL (misal: ?name=LAPOR!&url=https://lapor.go.id)
            const urlParams = new URLSearchParams(window.location.search);

            // 2. Ekstrak nilai dari 'name' dan 'url'
            const serviceName = urlParams.get('name');
            const serviceUrl = urlParams.get('url');

            // 3. Pastikan parameter ada sebelum memanipulasi DOM
            if (serviceName && serviceUrl) {
                // Ubah Title Halaman
                document.title = `${serviceName} - Nunukan Satu`;

                // Ubah Judul Layanan di Header (Navbar)
                document.getElementById('layanan-title').textContent = serviceName;

                // Ubah dan Muat URL ke dalam Iframe
                document.getElementById('layanan-iframe').src = serviceUrl;
            } else {
                // Tampilkan pesan error jika URL diakses secara langsung tanpa parameter
                document.getElementById('layanan-title').textContent = "Layanan Tidak Ditemukan";
                document.getElementById('layanan-iframe').outerHTML = `
                    <div class="container mt-5 text-center">
                        <h2 style="color: white">Maaf, terjadi kesalahan. Parameter url tidak valid.</h2>
                        <a href="../index.html" class="btn btn-primary mt-3">Kembali ke Beranda</a>
                    </div>
                `;
            }
        });
    </script>
</body>

</html>
